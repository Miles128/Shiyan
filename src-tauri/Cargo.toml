[package]
name = "shiyan"
version = "0.1.0"
description = "Shiyan (拾言) — local-first English reading app for Mac"
authors = ["sihai"]
edition = "2021"

[lib]
name = "shiyan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["core"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
shiyan-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"

[profile.dev]
debug = "line-tables-only"
# Panic line numbers still resolve, but DWARF is dropped from the binary and
# staticlib (~200MB). Debugging a panic still shows file:line.
strip = "debuginfo"
# Incremental artifacts for this dep graph cost ~2GB and buy almost nothing:
# only the two local crates ever rebuild, and they are small. Keeps
# src-tauri/target in the low GB instead of ~6GB.
incremental = false

[profile.dev.package."*"]
debug = false
strip = "debuginfo"
